slug: telecom-rag-agent
name: Telecom RAG Agent
description: 'A small retrieval-augmented telecom agent: retrieves context from a
  TeleQnA knowledge base, then answers a multiple-choice question or refuses when
  confidence is low. Dependencies (embedder + LLM) are injected, so the definition
  is reusable and testable with stubs. Maps the refusal guardrail to the UAE AI Charter
  (human oversight / robustness).'
version: 1.0.0
date_added: '2026-10-20'
added_by: vishnu.n@ieee.org
framework: custom (retrieve / answer / refuse)
model: google/flan-t5-base + all-MiniLM-L6-v2
tools:
- retrieve
- answer
- refuse
guardrails: Refuses (returns None) when top retrieval similarity < 0.25; logs every
  tool call for audit.
dataset: teleqna
notebook: telecom-rag-agent
tags:
- agentic
- rag
- llm
- telecom
- itu-ai4h
