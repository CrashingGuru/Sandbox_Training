chive.org/web/20260727035555/https://schema.org',  '@type': 'WebSite',  'url': 'http://web.archive.org/web/20260727035555/https://www.vision2030.gov.sa/en/',  'name': 'Saudi Vision 2030',  'potentialAction': {    '@type': 'SearchAction',    'target': 'http://web.archive.org/web/20260727035555/https://www.vision2030.gov.sa/en/search?name={search_term_string}',    'query-input': 'required name=search_term_string'  }}\u003c/script\u003e    \u003cscript type='application/ld+json'\u003e    {      '@context': 'http://web.archive.org/web/20260727035555/https://schema.org',      '@type': 'WebPage',      'name': 'National Industrial Development and Logistics Program',      'url': 'http://web.archive.org/web/20260727035555/https://www.vision2030.gov.sa/en/explore/programs/national-industrial-development-and-logistics-program/',      'description': 'Positions Saudi Arabia as an industrial leader and logistics hub by developing key sectors and leveraging its strategic location.',      'inLanguage': 'en',      'isPartOf': {        '@type': 'WebSite',        'name': 'Vision Realization Programs',        'url': 'http://web.archive.org/web/20260727035555/https://www.vision2030.gov.sa/en/explore/programs/'      }    }    \u003c/script\u003e"},"data":{"0-innerBanner":{"title":"National Industrial Development and Logistics Program","componentID":"innerBanner31fd5ab9","segmentTitle":"Vision Realization Programs","description":"","videoUrl":"","videoThumbnail":"","imageSrc":"/media/zpriu5ac/رفع-تنافسية-قطاع-الطاقة-min.jpg","imageTitle":"National Industrial Development and Logistics Program","mobileUrl":"","ctaHref":"","playCtaTitle":"","playCtaVideoUrl":"","icon_type":"play2"},"breadcrumb":[{"title":"Saudi Vision 2030","href":"/api/GetContent?pageId=1084\u0026lang=en","slug":"/en/","isAnchorBlank":false,"isBlankPage":false,"isDarkHeader":true,"isRightAligned":true,"lastUpdate":"2026-07-13T14:42:43Z","position":0},{"title":"Explore","href":"/api/GetContent?pageId=4216\u0026lang=en","slug":"/en/explore/","isAnchorBlank":false,"isBlankPage":false,"isDarkHeader":false,"isRightAligned":false,"lastUpdate":"2026-07-14T17:07:59.91Z","position":0},{"title":"Vision Realization Programs","href":"/api/GetContent?pageId=4390\u0026lang=en","slug":"/en/explore/programs/","isAnchorBlank":false,"isBlankPage":false,"isDarkHeader":false,"isRightAligned":false,"lastUpdate":"2025-11-23T15:35:45.29Z","position":0},{"title":"National Industrial Development and Logistics Program","href":"/api/GetContent?pageId=9126\u0026lang=en","slug":"/en/explore/programs/national-industrial-development-and-logistics-program/","isAnchorBlank":false,"isBlankPage":false,"isDarkHeader":false,"isRightAligned":false,"lastUpdate":"2026-07-16T21:32:16.103Z","position":0}],"1-exploreOurVision":{"heading":"","componentID":"exploreOurVision12d01dd5","subHeading":"","body":"Saudi Arabia: a nation with a unique strategic location that connects three continents, an epicenter of trade and rich in natural resources. From mining and energy, to industry and logistics, the National Industrial Development and Logistics Program is developing high growth sectors domestically and supporting an open economy that welcomes the injection of foreign capital. The Kingdom’s journey to becoming a leading industrial powerhouse and global logistics hub has just begun."},"2-leadershipMessageSticky":{"heading":"","componentID":"leadershipMessageStickya299849f","body":"","image":"/media/b5qnbxgz/logistics-768.png","imageTitle":"","mobileUrl":"/media/b5qnbxgz/logistics-768.png","messages":[{"id":1,"text":" "}],"content":"\u003cp dir=\"rtl\"\u003e \u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003eLaunched in 2019, the National Industrial Development and Logistics Program is transforming the Kingdom into a leading global player in the energy, mining, logistics and industry sectors. These high-growth sectors are diversifying Saudi Arabia's economy, creating quality jobs and securing sustainable growth for future generations.\u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003e \u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003eAs a reliable and responsible energy provider to the world, the Kingdom is entering a new green era. By investing heavily in renewable energy solutions such as wind and solar, the Program promotes a clean energy and low carbon future, supporting Saudi Arabia's goal of net zero emissions by 2060. \u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003e \u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003eAmid the global effort towards reducing emissions, Saudi Arabia’s minerals - valued at $2.5+ trillion - are in high demand. The Program has made remarkable improvements to industry regulations and legislation, positioning the Kingdom as a leading nation in mining.\u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003e \u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003eLeveraging the Kingdom’s competitive advantage as the crossroad of three continents, the Program is unleashing Saudi Arabia’s potential as a global logistics hub with high efficiency, quality and speed.\u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003e \u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003eAs part of the effort to support the growth of the Kingdom's premier industrial infrastructure, the newly launched Strategy for Industry is enabling Saudi Arabia to secure global supply chains and export high-tech products to the world.\u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003e \u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003eThrough programs such as Made in Saudi to enhance local content in oil and non-oil sectors, the Program is paving the way for Saudi Arabia's Fourth Industrial Revolution which will harness new technologies for the betterment of society.\u003c/p\u003e\n\u003cp\u003e \u003c/p\u003e","isContentOnRight":true,"designPattern":true},"3-secObjectiveSlider":{"heading":"Strategic Objectives","componentID":"secObjectiveSlider00ea8b79","image":"/me
