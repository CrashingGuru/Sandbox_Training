><body><div id="__next"></div><script id="__NEXT_DATA__" type="application/json">{"props":{"pageProps":{"mainData":{"metaData":{"title":"Saudi Vision 2030 - National Transformation Program","metaKeywords":"","metaDescription":"Enhances government performance, digital services, and private-sector enablement to drive transformation.","canonicalURL":"national-transformation-program","imageUrl":"","lastUpdateSeo":"Last Update: 14-07-2026 11:29 AM","jsonLd":"\u003cscript type='application/ld+json'\u003e{  '@context': 'http://web.archive.org/web/20260725145040/https://schema.org',  '@type': 'BreadcrumbList',  'itemListElement': [    {      '@type': 'ListItem',      'position': 1,      'name': 'Saudi Vision 2030',      'item': 'http://web.archive.org/web/20260725145040/https://www.vision2030.gov.sa/en/'    }{      '@type': 'ListItem',      'position': 2,      'name': 'Explore',      'item': 'http://web.archive.org/web/20260725145040/https://www.vision2030.gov.sa/en/explore/'    }{      '@type': 'ListItem',      'position': 3,      'name': 'Vision Realization Programs',      'item': 'http://web.archive.org/web/20260725145040/https://www.vision2030.gov.sa/en/explore/programs/'    }{      '@type': 'ListItem',      'position': 4,      'name': 'National Transformation Program',      'item': 'http://web.archive.org/web/20260725145040/https://www.vision2030.gov.sa/en/explore/programs/national-transformation-program/'    }  ]}\u003c/script\u003e\u003cscript type='application/ld+json'\u003e{  '@context': 'http://web.archive.org/web/20260725145040/https://schema.org',  '@type': 'WebSite',  'url': 'http://web.archive.org/web/20260725145040/https://www.vision2030.gov.sa/en/',  'name': 'Saudi Vision 2030',  'potentialAction': {    '@type': 'SearchAction',    'target': 'http://web.archive.org/web/20260725145040/https://www.vision2030.gov.sa/en/search?name={search_term_string}',    'query-input': 'required name=search_term_string'  }}\u003c/script\u003e    \u003cscript type='application/ld+json'\u003e    {      '@context': 'http://web.archive.org/web/20260725145040/https://schema.org',      '@type': 'WebPage',      'name': 'National Transformation Program',      'url': 'http://web.archive.org/web/20260725145040/https://www.vision2030.gov.sa/en/explore/programs/national-transformation-program/',      'description': 'Enhances government performance, digital services, and private-sector enablement to drive transformation.',      'inLanguage': 'en',      'isPartOf': {        '@type': 'WebSite',        'name': 'Vision Realization Programs',        'url': 'http://web.archive.org/web/20260725145040/https://www.vision2030.gov.sa/en/explore/programs/'      }    }    \u003c/script\u003e"},"data":{"0-innerBanner":{"title":"National Transformation Program","componentID":"innerBannere3d0374d","segmentTitle":"Vision Realization Programs","description":"","videoUrl":"","videoThumbnail":"","imageSrc":"/media/juzfjmri/national-transformation-program.webp","imageTitle":"National Transformation Program","mobileUrl":"/media/juzfjmri/national-transformation-program.webp","ctaHref":"","playCtaTitle":"","playCtaVideoUrl":"","icon_type":"play2"},"breadcrumb":[{"title":"Saudi Vision 2030","href":"/api/GetContent?pageId=1084\u0026lang=en","slug":"/en/","isAnchorBlank":false,"isBlankPage":false,"isDarkHeader":true,"isRightAligned":true,"lastUpdate":"2026-07-13T14:42:43Z","position":0},{"title":"Explore","href":"/api/GetContent?pageId=4216\u0026lang=en","slug":"/en/explore/","isAnchorBlank":false,"isBlankPage":false,"isDarkHeader":false,"isRightAligned":false,"lastUpdate":"2026-07-14T17:07:59.91Z","position":0},{"title":"Vision Realization Programs","href":"/api/GetContent?pageId=4390\u0026lang=en","slug":"/en/explore/programs/","isAnchorBlank":false,"isBlankPage":false,"isDarkHeader":false,"isRightAligned":false,"lastUpdate":"2025-11-23T15:35:45.29Z","position":0},{"title":"National Transformation Program","href":"/api/GetContent?pageId=9083\u0026lang=en","slug":"/en/explore/programs/national-transformation-program/","isAnchorBlank":false,"isBlankPage":false,"isDarkHeader":false,"isRightAligned":false,"lastUpdate":"2026-07-14T11:29:23.133Z","position":0}],"1-exploreOurVision":{"heading":"","componentID":"exploreOurVisionc53e5ac6","subHeading":"","body":"Since the launch of Vision 2030, unprecedented changes throughout Saudi Arabia have reshaped what it means to live in the Kingdom. Such remarkable change and growth are driven in part by the National Transformation Program. From digitizing government services to save time and effort, to promoting an inclusive private sector which prioritizes your financial security, the Program is creating a diversified, innovative, and world-leading nation."},"2-leadershipMessageSticky":{"heading":"","componentID":"leadershipMessageSticky01ac7985","body":"","image":"/media/vx4h0415/artboard-3.png","imageTitle":"","mobileUrl":"/media/vx4h0415/artboard-3.png","messages":[{"id":1,"text":"\u0026nbsp;"}],"content":"\u003cp dir=\"rtl\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003eLaunched in 2016, the National Transformation Program was the first Vision Realization Program established under Vision 2030. The Program works tirelessly to achieve strategic objectives that are transforming Saudi Arabia into a leading nation. This covers a range of themes, including empowering the private sector, achieving government excellence, and developing economic partnerships.\u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003eThe Program is accelerating the Kingdom’s digital transformation, too: from starting an online business in just three minutes to attending court sessions from the comfort of your home, changes like these help meet your needs, wherever you are.\u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003eToday’s workplace is more accessible and inclusive than ever, thanks to a series of initiatives launched by the Program. With employment opportunities in sectors that didn’t exist six years ago, Saudi women are joining the workforce at an unprecedented pace, while employment rates for disabled people are at a record high.\u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003eThe values of giving and compassion are firmly rooted in Saudi society, which is why the Program is actively developing the non-profit sector and creating platforms like\u0026nbsp;\u003ca rel=\"noopener\" href=\"https://www.vision2030.gov.sa/en/explore-more/national-volunteer-portal/\" target=\"_blank\" title=\"Volunteer Portal\"\u003ethe National Volunteer Portal\u003c/a\u003e. Volunteerism in Saudi Arabia has seen a 30-fold increase as more and more people give back to their community.\u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003e\u0026nbsp;\u003c/p\u003e\n\u003cp style=\"direction: ltr;\"\u003eAs we reach the halfway mark of Vision 2030, the Program continues to deliver its promise of building a better country and fulfilling our dream of prosperity.\u003c/p\u003e\n\u003cp\u003e\u0026nbsp;\u003c/p\u003e","isContentOnRight":true,"designPattern":true},"3-secObjectiveSlider":{"heading":"Strategic Objectives","componentID":"secObjectiveSliderfbaf5e34","image":"/media/4aigxkd0/national-transformation-program-main-image.jfif","imageTitle":"Strategic Objectives","mobileImage":"/media/4aigxkd0/national-transformation-program-main-image.jfif","items":[{"title":"Improve quality of services provided in Saudi cities","badgeIcon":""},{"title":"Foster values of equity \u0026 transparency","badgeIcon":""},{"title":"Reduce all types of pollution (e.g. air, sound, water, soil)","badgeIcon":""},{"title":"Safeguard the environment from natural threats","badgeIcon":""},{"title":"Protect \u0026 rehabilitate natural landscapes","badgeIcon":""},{"title":"Empower citizens through the welfar
