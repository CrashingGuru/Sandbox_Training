lankPage":false,"isDarkHeader":false,"isRightAligned":false,"lastUpdate":"2025-11-23T15:35:45.29Z","position":0},{"title":"Health Sector Transformation Program","href":"/api/GetContent?pageId=8986\u0026lang=en","slug":"/en/explore/programs/health-sector-transformation-program/","isAnchorBlank":false,"isBlankPage":false,"isDarkHeader":false,"isRightAligned":false,"lastUpdate":"2026-07-14T11:22:19.733Z","position":0}],"1-exploreOurVision":{"heading":"","componentID":"exploreOurVision41b05e2c","subHeading":"","body":"With a focus on improving access to healthcare, modernizing facilities and equipment, and enhancing the role of private sector investment, Saudi Arabia’s healthcare system is undergoing a transformation to meet the needs of every member of society."},"2-leadershipMessageSticky":{"heading":"","componentID":"leadershipMessageStickyff7c071e","body":"","image":"/media/315bi4oq/_ssg6032.jpg","imageTitle":"","mobileUrl":"/media/315bi4oq/_ssg6032.jpg","messages":[{"id":1,"text":"The Healthcare Sector Transformation Program is transforming the Kingdom's healthcare system to be more comprehensive, effective, and integrated than ever before. This enhanced system prioritizes innovation, financial sustainability, and disease prevention while improving access to healthcare. It also focuses on expanding e-health services and digital solutions, improving the quality of care, and adhering to international standards.\u003cbr\u003e\u003cbr\u003eThe Program's strong cooperation and integration with government entities enabled Saudi Arabia to swiftly and effectively address the COVID-19 pandemic. Through the use of mobile applications, streamlined vaccine protocols, and increased access to medical services, the Kingdom was a global model of excellence in successfully mitigating the spread of the virus.\u003cbr\u003e\u003cbr\u003eFrom remote surgeries guided by top physicians to virtual consultations resulting in seamless prescriptions, the Kingdom is leading the charge in utilizing technology to revolutionize the delivery of healthcare services with ease and efficiency. Launched in 2022,\u003cspan\u003e \u003c/span\u003e\u003ca rel=\"noopener\" href=\"https://www.moh.gov.sa/en/Ministry/Projects/Documents/Seha-Virtual-Hospital.pdf\" target=\"_blank\"\u003ethe SEHA Virtual Hospital\u003c/a\u003e\u003cspan\u003e is the largest of its kind globally, connecting over 150 hospitals with more than 30 specialized health services.\u003c/span\u003e\u003cbr\u003e\u003cbr\u003eThe Program is also improving public health and preventing diseases. This is a crucial area of investment for the health and productivity of individuals and communities, as prevention is often more cost effective than illness and injury treatment.\u003cbr\u003e\u003cbr\u003eThe private sector is vital in supporting the Kingdom’s efforts to achieve its national health goals, ensuring everyone has access to high-quality healthcare."}],"content":"\u003cp\u003eThe Healthcare Sector Transformation Program is transforming the Kingdom's healthcare system to be more comprehensive, effective, and integrated than ever before. This enhanced system prioritizes innovation, financial sustainability, and disease prevention while improving access to healthcare. It also focuses on expanding e-health services and digital solutions, improving the quality of care, and adhering to international standards.\u003cbr\u003e\u003cbr\u003eThe Program's strong cooperation and integration with government entities enabled Saudi Arabia to swiftly and effectively address the COVID-19 pandemic. Through the use of mobile applications, streamlined vaccine protocols, and increased access to medical services, the Kingdom was a global model of excellence in successfully mitigating the spread of the virus.\u003cbr\u003e\u003cbr\u003eFrom remote surgeries guided by top physicians to virtual consultations resulting in seamless prescriptions, the Kingdom is leading the charge in utilizing technology to revolutionize the delivery of healthcare services with ease and efficiency. Launched in 2022,\u003cspan\u003e \u003c/span\u003e\u003ca rel=\"noopener\" href=\"https://www.moh.gov.sa/en/Ministry/Projects/Documents/Seha-Virtual-Hospital.pdf\" target=\"_blank\"\u003ethe SEHA Virtual Hospital\u003c/a\u003e\u003cspan\u003e is the largest of its kind globally, connecting over 150 hospitals with more than 30 specialized health services.\u003c/span\u003e\u003cbr\u003e\u003cbr\u003eThe Program is also improving public health and preventing diseases. This is a crucial area of investment for the health and productivity of individuals and communities, as prevention is often more cost effective than illness and injury treatment.\u003cbr\u003e\u003cbr\u003eThe private sector is vital in supporting the Kingdom’s efforts to achieve its national health goals, ensuring everyone has access to high-quality healthcare.\u003c/p\u003e","isContentOnRight":true,"designPattern":true},"3-secObjectiveSlider":{"heading":"Objectives","componentID":"secObjectiveSlider20ea44a2","image":"/media/fgkinp5d/widespread-healthcare-services-across-the-kingdom.webp","imageTitle":"Objectives","mobileImage":"/media/fgkinp5d/widespread-healthcare-services-across-the-kingdom.webp","items":[{"title":"Ease the access to healthcare services","badgeIcon":""},{"title":"Improve value of healthcare services","badgeIcon":""},{"title":"Strengthen prevention against health threats","badgeIcon":""},{"title":"Enhance traffic safety","badgeIcon":""}]},"4-targetSlider":{"componentID":"targetSlider911f7bb7","heading":"Targets","items":[{"id":0,"title":"85.76%","value":"%","cardImg":"","imageTitle":"","cardPara":"Increase in the beneficiary satisfaction rate with health service experiences during hospitalization"},{"id":1,"title":"100%","value":"%","cardImg":"","imageTitle":"","cardPara":"Ensure the dissemination of the unified digital medical record to include 100% of the population."},{"id":2,"title":"90%","value":"%","cardImg":"","imageTi
