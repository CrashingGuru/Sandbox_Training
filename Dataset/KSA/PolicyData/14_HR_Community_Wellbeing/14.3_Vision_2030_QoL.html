GetContent?pageId=1084\u0026lang=en","slug":"/en/","isAnchorBlank":false,"isBlankPage":false,"isDarkHeader":true,"isRightAligned":true,"lastUpdate":"2026-03-02T11:45:47.53Z","position":0},{"title":"Explore","href":"/api/GetContent?pageId=4216\u0026lang=en","slug":"/en/explore/","isAnchorBlank":false,"isBlankPage":false,"isDarkHeader":false,"isRightAligned":false,"lastUpdate":"2025-09-15T11:22:01.233Z","position":0},{"title":"Vision Realization Programs","href":"/api/GetContent?pageId=4390\u0026lang=en","slug":"/en/explore/programs/","isAnchorBlank":false,"isBlankPage":false,"isDarkHeader":false,"isRightAligned":false,"lastUpdate":"2025-11-23T15:35:45.29Z","position":0},{"title":"Quality of Life Program","href":"/api/GetContent?pageId=9120\u0026lang=en","slug":"/en/explore/programs/quality-of-life-program/","isAnchorBlank":false,"isBlankPage":false,"isDarkHeader":false,"isRightAligned":false,"lastUpdate":"2025-12-17T15:45:19.53Z","position":0}],"1-exploreOurVision":{"heading":"","componentID":"exploreOurVision737bf4d3","subHeading":"","body":"Experiences that were once considered a dream are now a daily reality for Saudi residents and visitors alike – attending red-carpet film festivals, attending premier sporting events and experiencing the treasured secrets of the Kingdom’s seven UNESCO World Heritage Sites.\n\nThe Quality of Life Program enables culture, entertainment, sports and tourism to flourish in Saudi Arabia, delivering enriched and better lives for all."},"2-leadershipMessageSticky":{"heading":"","componentID":"leadershipMessageStickyd3fadde8","body":"","image":"/media/rhfhmvws/qol-intro.webp","imageTitle":"","mobileUrl":"/media/rhfhmvws/qol-intro.webp","messages":[{"id":1,"text":"Launched in 2018, the Quality of Life Program is transforming Saudi Arabia into a world-renowned sports and entertainment location, a global tourism hotspot, and a top-ranked country people can call home.\n"},{"id":2,"text":"Enhancing a wide variety of sectors, the Program focuses on the empowerment of arts and culture, promotion of sports and leading a healthy life, and the development of more livable urban areas. As well as creating exciting new sectors and diversifying economic activity, the Program is bolstering local employment opportunities and beautifying cities across the Kingdom. These efforts combine to create a better quality of life for all.\n"},{"id":3,"text":"The Program is empowering Saudi Arabia’s transformation as a top destination to live, work and play. Home to a dynamic population, the majority of whom are under 35, the Kingdom is building an engaging society for citizens, residents, and visitors.\n"},{"id":4,"text":"Since the launch of the tourist visa in 2019, there have been more than 94 million visits from across the globe, resulting in a plethora of opportunities in the fields of tourism, hospitality, and entertainment. The Program has introduced initiatives to train millions of skilled people needed by 2030 to cater for these demands, and to support the Kingdom’s private sector.\n"},{"id":5,"text":"Continued innovation is delivering the promise of greater quality of life, underpinning Vision 2030’s ambitious goals for a more livable and vibrant society."}],"content":"\u003cp\u003eLaunched in 2018, the Quality of Life Program is transforming Saudi Arabia into a world-renowned sports and entertainment location, a global tourism hotspot, and a top-ranked country people can call home.\u003c/p\u003e\n\u003cp\u003eEnhancing a wide variety of sectors, the Program focuses on the empowerment of arts and culture, promotion of sports and leading a healthy life, and the development of more livable urban areas. As well as creating exciting new sectors and diversifying economic activity, the Program is bolstering local employment opportunities and beautifying cities across the Kingdom. These efforts combine to create a better quality of life for all.\u003c/p\u003e\n\u003cp\u003eThe Program is empowering Saudi Arabia’s transformation as a top destination to live, work and play. Home to a dynamic population, the majority of whom are under 35, the Kingdom is building an engaging society for citizens, residents, and visitors.\u003c/p\u003e\n\u003cp\u003eSince the launch of the tourist visa in 2019, there have been more than 94 million visits from across the globe, resulting in a plethora of opportunities in the fields of tourism, hospitality, and entertainment. The Program has introduced initiatives to train millions of skilled people needed by 2030 to cater for these demands, and to support the Kingdom’s private sector.\u003c/p\u003e\n\u003cp\u003eContinued innovation is delivering the promise of greater quality of life, underpinning Vision 2030’s ambitious goals for a more livable and vibrant society.\u003c/p\u003e","isContentOnRight":true,"designPattern":true},"3-secObjectiveSlider":{"heading":"Strategic Objectives","componentID":"secObjectiveSlider71d94aae","image":"/media/ev5dbmco/qol-t-01.jpg","imageTitle":"Strategic Objectives","mobileImage":"/media/ev5dbmco/qol-t-01.jpg","items":[{"title":"Increase public participation in sports \u0026 athletic activities","badgeIcon":""},{"title":"Reach regional \u0026 global excellence in selected professional sports","badgeIcon":""},{"title":"Boosting Saudi Arabia's contribution to arts \u0026 culture","badgeIcon":""},{"title":"Develop \u0026 diversify entertainment opportunities to meet population's needs","badgeIcon":""},{"title":"Conserve \u0026 promote Islamic, Arab \u0026 National heritage of the Kingdom","badgeIcon":""},{"title":"Improve the urban landscape in Saudi cities","badgeIcon":""},{"title":"Improve quality of services provided in Saudi cities","badgeIcon":""},{"title":"Improve living conditions for expats","badgeIcon":""},{"title":"Enable the development of the tourism sector","badgeIcon":""},{"title":"Enhance the nation's immunity towards drug abuse","badgeIcon":""}]},"4-targetSlider":{"componentID":"targetSlider19505bcc","heading":"
