ref":"/api/GetContent?pageId=9096\u0026lang=en","slug":"/en/explore/programs/human-capability-development-program/","isAnchorBlank":false,"isBlankPage":false,"isDarkHeader":false,"isRightAligned":false,"lastUpdate":"2026-07-13T15:14:17.67Z","position":0}],"1-exploreOurVision":{"heading":"","componentID":"exploreOurVision80132bd8","subHeading":"","body":"The Human Capability Development Program is on an ambitious journey to empower citizens and elevate their global competitiveness. By implementing a dynamic strategy that encompasses every stage of learning, from early childhood education to lifelong learning, the Program is creating a pathway for individuals to reach their full potential. This strategy is designed to be inclusive, involving collaboration between government entities, the private sector and non-profit organizations to ensure the success of our citizens."},"2-leadershipMessageSticky":{"heading":"","componentID":"leadershipMessageSticky56d33819","body":"","image":"/media/q03ausbp/برنامج-تنمية-القدرات-البشرية.webp","imageTitle":"","mobileUrl":"/media/q03ausbp/برنامج-تنمية-القدرات-البشرية.webp","messages":[{"id":1,"text":"Launched in 2021, the Human Capability Development Program is empowering Saudi citizens and setting them up for success at every stage of life. With a focus on matching educational outcomes to the needs of the labor market, fostering innovation, and developing and upgrading skills, the Program creates a pathway for individuals to reach their full potential. Additionally, the Program supports instilling core values and promoting and preserving the Arabic language, fostering a sense of national pride, and working towards a strong economy supported by a highly capable workforce.\n"},{"id":2,"text":"The Kingdom has made great strides to empower its citizens and ensure they have the skills they need to thrive at every stage of life and keep pace with the changes of the future. In the past, opportunities for learning and developing skills were limited, but now with the launch of the Program, things have improved for the best. Today, more kids are enrolled in early childhood programs than ever before, and talented students are representing Saudi Arabia on the international stage, bringing home academic awards and medals. The Kingdom also opened up new paths for scholarships through the Custodian of the Two Holy Mosques Scholarship Program and introduced an educational visa for short and long-term study. With Saudi Arabia leading the world in digital skills, the Kingdom is becoming a place where everyone can find new chances to grow and succeed every day."}],"content":"\u003cp\u003eLaunched in 2021, the Human Capability Development Program is empowering Saudi citizens and setting them up for success at every stage of life. With a focus on matching educational outcomes to the needs of the labor market, fostering innovation, and developing and upgrading skills, the Program creates a pathway for individuals to reach their full potential. Additionally, the Program supports instilling core values and promoting and preserving the Arabic language, fostering a sense of national pride, and working towards a strong economy supported by a highly capable workforce.\u003c/p\u003e\n\u003cp\u003eThe Kingdom has made great strides to empower its citizens and ensure they have the skills they need to thrive at every stage of life and keep pace with the changes of the future. In the past, opportunities for learning and developing skills were limited, but now with the launch of the Program, things have improved for the best. Today, more kids are enrolled in early childhood programs than ever before, and talented students are representing Saudi Arabia on the international stage, bringing home academic awards and medals. The Kingdom also opened up new paths for scholarships through the Custodian of the Two Holy Mosques Scholarship Program and introduced an educational visa for short and long-term study. With Saudi Arabia leading the world in digital skills, the Kingdom is becoming a place where everyone can find new chances to grow and succeed every day.\u003c/p\u003e","isContentOnRight":true,"designPattern":true},"3-secObjectiveSlider":{"heading":"Strategic Objectives","componentID":"secObjectiveSliderc67a08b4","image":"/media/fjvptx3s/hcdp-header.webp","imageTitle":"Strategic Objectives","mobileImage":"","items":[{"title":"Foster values of moderation \u0026 tolerance","badgeIcon":""},{"title":"Foster values of excellence \u0026 discipline","badgeIcon":""},{"title":"Foster values of determination \u0026 perseverance","badgeIcon":""},{"title":"Instill national values and strengthen the sense of national belonging","badgeIcon":""},{"title":"Uphold the Arabic language","badgeIcon":""},{"title":"Enhance family involvement in preparing for their children's future","badgeIcon":""},{"title":"Develop positive attitude, resilience \u0026 hard-work culture among our children","badgeIcon":""},{"title":"Build a life-long learning journey","badgeIcon":""},{"title":"Improve equity of access to education (esp. in rural areas)","badgeIcon":""},{"title":"Improve fundamental learning outcomes","badgeIcon":""},{"title":"Improve ranking of educational institutions (e.g. Universities)","badgeIcon":""},{"title":"Develop our brightest minds in priority fields","badgeIcon":""},{"title":"Ensure alignment of educational outputs with labor market needs","badgeIcon":""},{"title":"Expand vocational training to provide for labor market needs","badgeIcon":""},{"title":"Improve readiness of youth to enter the labor market","badgeIcon":""},{"title":"Nurture and support the innovation \u0026 entrepreneurship culture","badgeIcon":""}]},"4-targetSlider":{"componentID":"targetSlider84781216","heading":"2025 Targets","items":[{"id":0,"title":"40%","value":"","cardImg":"","imageTitle":"","cardPara":"Of children enrolled in kindergarten by 2025."},{"id":1,"title":"6","value":"","cardImg":"","imageTitle":"","cardPara":"Saudi uni
