<script type="text/javascript">
function ready() {
  var breadcrumb = document.querySelector('span[id$=mainBreadcrumb]');
  if (!breadcrumb) return;
  var isEn = window.location.href.toLowerCase().includes('/en/');
  var homeUrl = isEn ? '/en/Pages/default.aspx' : '/ar/Pages/Default.aspx';
  var homeLabel = isEn ? 'Home' : 'الرئيسة';
  // --- Home item detection ---
  var items = breadcrumb.querySelectorAll(':scope > span');
  var homeItem = null;
  items.forEach(function(item) {
    var a = item.querySelector('a');
    if (a) {
      var href = a.getAttribute('href').toLowerCase();
      if (href === '/en/pages/default.aspx' || href === '/ar/pages/default.aspx') {
        homeItem = item;
      }
    }
  });
  if (homeItem) {
    var homeAnchor = homeItem.querySelector('a');
    homeAnchor.innerHTML = homeLabel;
    homeAnchor.setAttribute('href', homeUrl);
    while (breadcrumb.firstChild !== homeItem) {
      breadcrumb.removeChild(breadcrumb.firstChild);
    }
  } else {
    var separator = document.createElement('span');
    separator.innerHTML = ' / ';
    var homeSpan = document.createElement('span');
    homeSpan.innerHTML = "<a href='" + homeUrl + "'>" + homeLabel + "</a>";
    breadcrumb.insertBefore(separator, breadcrumb.firstChild);
    breadcrumb.insertBefore(homeSpan, breadcrumb.firstChild);
  }
  // --- Replace last item if it's the ministry name ---
  var allItems = breadcrumb.querySelectorAll(':scope > span');
  var lastItem = allItems[allItems.length - 1];
  if (lastItem) {
    var lastText = lastItem.textContent.trim();
    if (lastText === 'Ministry of Education' || lastText === 'وزارة التربية والتعليم') {
      var pageTitle = document.title.split(/[-|–]/)[0].trim();
      lastItem.textContent = pageTitle;
    }
  }
  // --- Replace separators ---
  var separatorSvg = isEn
    ? "<svg width='20' height='20' class='w-4 h-4 inline-block mx-2' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 256 256' aria-hidden='true'><rect width='256' height='256' fill='none'></rect><polyline points='96 48 176 128 96 208' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round' stroke-width='16'></polyline></svg>"
    : "<svg style='margin: 5px 5px 0px 5px;' width='20' height='20' aria-hidden='true' class='w-4 h-4 inline-block mx-2' xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect width='24' height='24' fill='none'></rect><path d='M15.5303 3.96967C15.8232 4.26256 15.8232 4.73744 15.5303 5.03033L8.56066 12L15.5303 18.9697C15.8232 19.2626 15.8232 19.7374 15.5303 20.0303C15.2374 20.3232 14.7626 20.3232 14.4697 20.0303L6.96967 12.5303C6.67678 12.2374 6.67678 11.7626 6.96967 11.4697L14.4697 3.96967C14.7626 3.67678 15.2374 3.67678 15.5303 3.96967Z' fill='none' stroke='currentColor' stroke-linecap='round' stroke-linejoin='round'></path></svg>";
  document.querySelectorAll(".pathSeparatorStyle").forEach(function(element) {
    element.innerHTML = separatorSvg;
  });
}
if (document.readyState !== 'loading') {
  ready();
} else {
  document.addEventListener('DOMContentLoaded', ready);
}
</script>
