slug: teleqna
name: TeleQnA - Telecom LLM Benchmark
description: 10,000 multiple-choice telecom questions across five categories (lexicon,
  research overview, research publications, standards overview, standards specifications)
  for assessing LLM telecom knowledge. Dataset is a password-protected zip (password
  'teleqnadataset', documented in the repo README) to prevent training-data contamination.
  Underpins the agentic RAG training row.
