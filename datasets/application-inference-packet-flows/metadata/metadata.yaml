slug: application-inference-packet-flows
name: Application Inference from Packet Flows
description: 'Header-derived traffic statistics from encrypted packet traces for classifying
  mobile application flows (facebook, google, instagram, mozilla, x, youtube). Two
  tasks: task1_static (full-flow) and task2_realtime_prefix5 (first-5-packet). From
  the ITU AI/ML Challenge; test labels are held by organizers. No IPs, DNS, SNI, Host,
  URLs or payloads are included.'
version: 1.0.0
date_added: '2026-10-19'
added_by: vishnu.n@ieee.org
source_type: external
source: https://github.com/FG-AI4H/application-inference-packet-flows-public
license: See source repository (ITU AI/ML Challenge terms)
tags:
- networking
- traffic-classification
- encrypted-traffic
- itu-ai4h
- challenge
- classification
