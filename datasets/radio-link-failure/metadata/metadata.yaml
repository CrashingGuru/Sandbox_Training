slug: radio-link-failure
name: Radio Link Failure Prediction (Turkcell, ITU 2021)
description: 'Regional microwave radio-link KPIs with weather (met) tables for predicting
  radio link failures (target ''rlf'' in rl-kpis). Highly imbalanced (~0.06% positive).
  Data is in RegionA.zip inside a .7z archive (6 TSVs: rl-kpis, rl-sites, distances,
  met-stations, met-real, met-forecast). ITU AI/ML in 5G Challenge 2021.'
